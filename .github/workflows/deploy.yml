name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          mkdir -p public/images
          cp src/assets/images/* public/images/ || true
          for f in src/assets/images/*_[0-9]*.jpg; do
            if [ -f "$f" ]; then
              clean_name=$(basename "$f" | sed -E 's/_[0-9]+\.jpg$/.jpg/')
              cp "$f" "public/images/$clean_name" || true
            fi
          done
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
