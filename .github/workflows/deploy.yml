name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Day 7 Image Assets
        run: |
          MISSING=0
          for img in pampers-win1.jpg pampers-win2.jpg pampers-win3.jpg huggies-lose1.jpg huggies-lose2.jpg huggies-lose3.jpg; do
            filepath="public/images/day7/$img"
            if [ ! -f "$filepath" ]; then
              echo "ERROR: Missing required Day 7 image asset: $filepath"
              MISSING=1
            elif [ ! -s "$filepath" ]; then
              echo "ERROR: Day 7 image asset is empty (0 bytes): $filepath"
              MISSING=1
            elif ! grep -q "images/day7/$img" src/data/adsBreakdowns.ts; then
              echo "ERROR: Filename mismatch — images/day7/$img is not referenced in src/data/adsBreakdowns.ts"
              MISSING=1
            else
              size=$(wc -c < "$filepath")
              echo "OK: Verified $filepath ($size bytes) and matched in src/data/adsBreakdowns.ts"
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "FATAL: Day 7 image validation failed. Ensure all 6 files exist and are non-empty in public/images/day7/."
            exit 1
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
